name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**"]
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK and CMake the app pins
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug || ./gradlew --no-daemon testDebugUnitTest assembleDebug  # one retry: Maven Central sometimes 403s CI runners
      - uses: actions/upload-artifact@v4
        with:
          name: free-printing-otg-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
